proxy-groups:
  - name: "🔰 模式选择"
    type: select
    proxies:
      - "⛓️ 链式代理"
      - "🛫 直连中转"
      - "🛬 直连落地"
      - "🔗 全局直连"
    interval: 3600
    timeout: 3000
    url: "http://www.gstatic.com/generate_204"
    lazy: true
    max-failed-times: 3
    hidden: false

  - name: "⛓️ 链式代理"
    type: select
    include-all: true
    filter: "(?i)落地|家宽"
    dialer-proxy: "🛫 链式中转"
    interval: 3600
    timeout: 3000
    url: "http://www.gstatic.com/generate_204"
    lazy: true
    max-failed-times: 3
    hidden: false
    icon: "https://cdn.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io/docs/assets/icons/openwrt.svg"

  - name: "🛫 直连中转"
    type: select
    proxies:
      - "♻️ 直连选优"
    include-all: true
    exclude-filter: "(?i)落地|家宽"
    interval: 3600
    timeout: 3000
    url: "http://www.gstatic.com/generate_204"
    lazy: true
    max-failed-times: 3
