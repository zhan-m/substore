# Substore 兼容配置文件，基于 Mihomo Party 脚本改编，与 linkproxy-singbox.json 保持对等
# 保留 DNS、规则提供者、规则和代理组结构；移除静态节点，依赖 Substore 订阅提供节点
# 链式代理：⛓️ 链式代理通过组级 dialer-proxy 指向 🛫 链式中转 → ♻️ 链式选优（专测 http://test.zhan-m.com/generate_204）
# 直连中转：🛫 直连中转 → ♻️ 直连选优（专测 http://www.gstatic.com/generate_204）；Mihomo 按 (节点, testUrl) 隔离测速历史，无需克隆节点

unified-delay: true

dns:
  enable: true
  listen: "0.0.0.0:1053"
  prefer-h3: false
  respect-rules: true
  use-system-hosts: false
  cache-algorithm: "arc"
  enhanced-mode: "fake-ip"
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "localhost.work.weixin.qq.com"
  default-nameserver:
    - "223.5.5.5"
    - "1.2.4.8"
  nameserver:
    - "https://cloudflare-dns.com/dns-query"
    - "https://77.88.8.8/dns-query"
    - "https://8.8.4.4/dns-query#ecs=1.1.1.1/24&ecs-override=true"
    - "https://208.67.222.222/dns-query#ecs=1.1.1.1/24&ecs-override=true"
    - "https://9.9.9.9/dns-query"
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query"
    - "https://doh.pub/dns-query"
  direct-nameserver:
    - "https://223.5.5.5/dns-query"
    - "https://doh.pub/dns-query"
  direct-nameserver-follow-policy: false
  nameserver-policy:
    "geosite:cn":
      - "https://223.5.5.5/dns-query"
      - "https://doh.pub/dns-query"

