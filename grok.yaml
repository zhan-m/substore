rules:
  # 拒绝 aTrust 慢网关的 TCP 6441 连接，优先于直连规则，让客户端尝试其他候选网关。
  - "AND,((NETWORK,TCP),(IP-CIDR,103.49.135.232/32),(DST-PORT,6441)),REJECT"
  # 公司内网 IP 段直连，排在上述精确拒绝规则之后、其他分流规则之前。
  # 直接指向「🔗 全局直连」而不是可被手动切换的「🐬 自定义直连」，避免误选节点。
  - "RULE-SET,customdirectip,🔗 全局直连,no-resolve"
  # 海外云图专属域名（需排在 customdirect 与 sangfor 关键字直连之前）
  - "DOMAIN,x.sangfor.com,海外云图"
  - "DOMAIN,xaasauth.sangfor.com,海外云图"
  - "DOMAIN,xaas.sangfor.com,海外云图"
  - "DOMAIN,x.forenova.com,海外云图"
  - "DOMAIN,xaasauth.forenova.com,海外云图"
  - "DOMAIN,xaas.forenova.com,海外云图"
  - "PROCESS-NAME,dota2.exe,🐬 自定义直连"
  - "PROCESS-NAME,steam.exe,🐬 自定义直连"
  - "RULE-SET,customdirect,🐬 自定义直连"
  - "DOMAIN-KEYWORD,sangfor,🐬 自定义直连"
  - "RULE-SET,customproxy,🐳 自定义代理"
  - "DOMAIN-SUFFIX,googleapis.cn,🔰 模式选择"
  - "DOMAIN-SUFFIX,gstatic.com,🔰 模式选择"
  - "DOMAIN-SUFFIX,xn--ngstr-lra8j.com,🔰 模式选择"
  - "DOMAIN-SUFFIX,github.io,🔰 模式选择"
  - "DOMAIN,v2rayse.com,🔰 模式选择"
  - "RULE-SET,openai,💸 ChatGPT-Gemini-XAI-Perplexity"
  - "RULE-SET,pikpak,🔰 模式选择"
  - "RULE-SET,bybit,🔰 模式选择"
  - "RULE-SET,anthropic,💵 Claude"
  - "RULE-SET,google-gemini,💸 ChatGPT-Gemini-XAI-Perplexity"
  - "RULE-SET,xai,💸 ChatGPT-Gemini-XAI-Perplexity"
  - "RULE-SET,perplexity,💸 ChatGPT-Gemini-XAI-Perplexity"
  - "RULE-SET,discord,🔰 模式选择"
  - "RULE-SET,applications,🔗 全局直连"
  - "RULE-SET,private,🔗 全局直连"
